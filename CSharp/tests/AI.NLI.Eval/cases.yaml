# Набор для замера на учебной системе оценки квартиры (AI.NLI.Samples/Apartment.cs).
# turns: реплики пользователя по порядку; если вопросы остались, а реплики кончились, отвечаем «не знаю».
# expected: какие значения должны оказаться в форме со слов пользователя.
# absent: каких полей в словах пользователя нет; значение там, кроме допущения, считается выдуманным.

- name: все данные сразу
  turns:
    - "Оцените квартиру с евроремонтом в Москве: 72 м², 3 комнаты, 7 этаж из 12, балкон есть."
  expected: { city: Москва, area: "72", rooms: "3", floor: "7", floors: "12", condition: евроремонт, balcony: "true" }
  absent: [year]

- name: ответ на вопрос
  turns:
    - "Хочу оценить двушку в Казани, 54 квадрата"
    - "пятый этаж"
  expected: { city: Казань, area: "54", rooms: "2", floor: "5" }
  absent: [year, floors]

- name: исправление
  turns:
    - "Квартира в Санкт-Петербурге, 45 метров, 2 комнаты, 3 этаж"
    - "Ой, не 45, а 48 метров"
  expected: { city: Санкт-Петербург, area: "48", rooms: "2", floor: "3" }
  absent: [year]

- name: не знаю
  turns:
    - "Оцените трешку в Казани на 60 метров"
    - "Не знаю, какой там этаж"
  expected: { city: Казань, area: "60", rooms: "3" }
  absent: [floor, year]

- name: отрицание и приблизительно
  turns:
    - "Примерно 80 квадратов в Москве, четыре комнаты, первый этаж, балкона нет, ремонт косметический"
  expected: { city: Москва, area: "80", rooms: "4", floor: "1", balcony: "false", condition: косметический }
  absent: [year, parking]

- name: зависимое поле
  turns:
    - "Двушка в Казани, 50 метров, 4 этаж, есть машино-место"
    - "подземное"
  expected: { city: Казань, area: "50", rooms: "2", floor: "4", parking: "true", parking_type: подземный }
  absent: [year]
