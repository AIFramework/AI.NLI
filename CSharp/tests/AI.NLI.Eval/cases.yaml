# Набор для замера на учебной регрессии цены квартиры в Таганроге (AI.NLI.Demo/TaganrogRegression.cs).
# turns: реплики пользователя по порядку; если вопросы остались, а реплики кончились, отвечаем «не знаю».
# expected: какие значения должны оказаться в форме со слов пользователя.
# absent: каких полей в словах пользователя нет; значение там, кроме допущения, считается выдуманным.

- name: все данные сразу
  turns:
    - "Оцените квартиру в Таганроге с евроремонтом: 72 м², 3 комнаты, 7 этаж из 9, балкон есть."
  expected: { area: "72", rooms: "3", floor: "7", floors: "9", condition: евроремонт, balcony: "true" }
  absent: [year]

- name: ответ на вопрос
  turns:
    - "Хочу оценить двушку в Таганроге, 54 квадрата"
    - "пятый этаж"
  expected: { area: "54", rooms: "2", floor: "5" }
  absent: [year, floors]

- name: исправление
  turns:
    - "Квартира в Таганроге, 45 метров, 2 комнаты, 3 этаж"
    - "Ой, не 45, а 48 метров"
  expected: { area: "48", rooms: "2", floor: "3" }
  absent: [year]

- name: не знаю
  turns:
    - "Оцените трешку на 60 метров"
    - "Не знаю, какой там этаж"
  expected: { area: "60", rooms: "3" }
  absent: [floor, year]

- name: отрицание и приблизительно
  turns:
    - "Примерно 80 квадратов, четыре комнаты, первый этаж, балкона нет, ремонт косметический"
  expected: { area: "80", rooms: "4", floor: "1", balcony: "false", condition: косметический }
  absent: [year, parking]

- name: зависимое поле
  turns:
    - "Двушка в Таганроге, 50 метров, 4 этаж, есть машино-место"
    - "подземное"
  expected: { area: "50", rooms: "2", floor: "4", parking: "true", parking_type: подземный }
  absent: [year]

- name: граница вместо значения
  turns:
    - "Однушка 38 метров, этаж выше пятого"
    - "восьмой"
  expected: { area: "38", rooms: "1", floor: "8" }
  absent: [year]
